<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>变频器在线监测演示</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #0f172a;
      background: #f7f9fc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }
    .toolbar {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px;
      border: 1px solid rgba(203, 213, 225, .86);
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 24px 70px rgba(15, 23, 42, .18);
      backdrop-filter: blur(18px);
    }
    button, a {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      color: #0f172a;
      background: transparent;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .primary {
      color: white;
      background: linear-gradient(135deg, #111827, #2563eb);
      box-shadow: 0 14px 34px rgba(37, 99, 235, .26);
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, .46);
      backdrop-filter: blur(18px);
    }
    .overlay.show { display: grid; }
    .qr-card {
      width: min(520px, 100%);
      border: 1px solid rgba(226, 232, 240, .94);
      border-radius: 28px;
      padding: 28px;
      text-align: center;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 34px 100px rgba(15, 23, 42, .28);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #2563eb;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    p {
      margin: 12px auto 20px;
      color: #64748b;
      line-height: 1.7;
      font-size: 15px;
    }
    img {
      width: min(330px, 74vw);
      height: auto;
      display: block;
      margin: 0 auto 16px;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      background: white;
    }
    .url {
      word-break: break-all;
      border-radius: 16px;
      padding: 12px 14px;
      color: #1d4ed8;
      background: #eff6ff;
      font-size: 14px;
      font-weight: 800;
    }
    .close {
      margin-top: 18px;
      border: 1px solid #dbe3ef;
      background: #fff;
    }
    @media (max-width: 720px) {
      .toolbar {
        left: 12px;
        right: 12px;
        bottom: 12px;
        justify-content: center;
        border-radius: 22px;
        flex-wrap: wrap;
      }
      button, a { min-height: 40px; padding: 0 12px; font-size: 13px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <iframe src="pc.html" title="变频器 PC 在线监测大屏"></iframe>
  <div class="toolbar">
    <button class="primary" id="scanButton" type="button">扫码体验</button>
    <a href="mobile.html" target="_blank" rel="noreferrer">打开手机页</a>
    <a href="pc.html" target="_blank" rel="noreferrer">打开大屏页</a>
  </div>
  <div class="overlay" id="overlay">
    <section class="qr-card" aria-label="扫码体验入口">
      <div class="eyebrow">MOBILE EXPERIENCE</div>
      <h1>扫码同步体验</h1>
      <p>观众使用手机扫描二维码，即可打开移动端交互控制台，查看历史曲线、预测曲线、故障段解释、模型切换和运维建议。</p>
      <img src="qr.png" alt="扫码体验二维码">
      <div class="url">https://fightingxgg.github.io/mobile.html</div>
      <button class="close" id="closeButton" type="button">返回演示</button>
    </section>
  </div>
  <script>
    const overlay = document.getElementById("overlay");
    document.getElementById("scanButton").addEventListener("click", () => overlay.classList.add("show"));
    document.getElementById("closeButton").addEventListener("click", () => overlay.classList.remove("show"));
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) overlay.classList.remove("show");
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") overlay.classList.remove("show");
    });
  </script>
</body>
</html>
